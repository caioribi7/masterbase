name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: masterbase
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: masterbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U masterbase"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://masterbase:ci@127.0.0.1:5432/masterbase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}

      - name: Testes do servidor
        working-directory: server
        run: cargo test

      - name: Compilar a tela
        working-directory: web
        run: npm ci && npm run build

      - name: Teste de ponta a ponta
        run: |
          # pg_dump/pg_restore na mesma versão do banco (a página Backups usa os dois)
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          PGPASSWORD=ci psql -h 127.0.0.1 -U masterbase -d masterbase -q -v ON_ERROR_STOP=1 -f dev/seed.sql
          # papel do editor SQL (só linhas), como o instalador cria
          PGPASSWORD=ci psql -h 127.0.0.1 -U masterbase -d masterbase -q -c "CREATE ROLE masterbase_sql LOGIN PASSWORD 'ci-sql'"
          (cd server && cargo build)
          # SMTP falso e um GitHub de mentira: testa e-mail e o começo do login com GitHub
          python3 dev/smtp-sink.py 2525 /tmp/mb-mail &
          export MB_URL=http://127.0.0.1:8081 MB_SMTP_HOST=127.0.0.1 MB_SMTP_PORT=2525 MB_MAIL_FROM=painel@ci.test MB_GITHUB_ID=smoke-id MB_GITHUB_SECRET=smoke-secret
          MB_SQL_URL=postgresql://masterbase_sql:ci-sql@127.0.0.1:5432/masterbase MB_CONFIG=/tmp/mb-ci.env \
          MB_ADDR=127.0.0.1:8081 MB_WEB_DIR=web/dist MB_BACKUP_DIR=/tmp/mb-backups server/target/debug/masterbase &
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8081/api/setup && break; sleep 1; done
          SINK=/tmp/mb-mail bash dev/smoke.sh http://127.0.0.1:8081
