[package]
name = "masterbase"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Postgres com tela visual, para quem não sabe SQL"
repository = "https://github.com/caioribi7/masterbase"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
strip = true
